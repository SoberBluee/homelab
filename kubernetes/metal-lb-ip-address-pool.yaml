apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: 
  name: metal-lb-iap
  namespace: metallb-system
spec: 
  addresses: 
  - 192.168.1.90-192.168.1.100

---

apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: 
  name: meta-lb-l2
  namespace: metallb-system
spec: 
  ipAddressPools:
  - metal-lb-iap


