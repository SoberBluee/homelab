apiVersion: v1
kind: Service
metadata:
  name: docmost-headless-service
  namespace: docmost
spec:
  clusterIP: None
  selector:
    app: docmost-app
  ports:
    - name: nextcloud-app
      port: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: docmost-service
  namespace: docmost
spec:
  type: NodePort
  selector:
    app: docmost-app
  ports:
    - name: nextcloud-app
      port: 3000
      targetPort: 3000
