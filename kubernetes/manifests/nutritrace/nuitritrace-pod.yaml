apiVersion: v1
kind: Pod
metadata:
  labels:
    app: nutritrace-pod
  name: nutritrace-pod
  namespace: nutritrace
spec:
  containers:
  - image: traceapps/nutritrace:latest
    name: nutritrace-pod
    ports:
      - containerPort: 3001
        protocol: TCP
    volumeMounts:
      - name: database
        mountPath: /db
      - name: uploads
        mountPath: /uploads
    env:
      - name: DB_PATH
        valueFrom:
          configMapKeyRef:
            name: nutritrace-cm
            key: DB_PATH
      - name: UPLOADS_PATH
        valueFrom:
          configMapKeyRef:
            name: nutritrace-cm
            key: UPLOADS_PATH
  volumes:
  - name: database
    nfs:
      server: 192.168.1.65
      path: /mnt/pve/bigkev/nutritrace/database
  - name: uploads
    nfs:
      server: 192.168.1.65
      path: /mnt/pve/bigkev/nutritrace/uploads
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
