apiVersion: v1
kind: Pod
metadata:
  labels:
    app: nutritrace-pod
  name: nutritrace-pod
  namespace: nutritrace
spec:
  containers:
  - image: ghcr.io/traceapps/nutritrace:1.1.0
    name: nutritrace-pod
    ports:
      - containerPort: 3001
        protocol: TCP
    volumeMounts:
      - name: nutritrace-vol
        mountPath: /database
      - name: nutritrace-vol
        mountPath: /uploads
    env:
      - name: DB_PATH
        valueFrom:
          configMapKeyRef:
            name: nutritrace-cm
            key: DB_PATH
      - name: UPLOADS_PATH
        valueFrom:
          configMapKeyRef:
            name: nutritrace-cm
            key: UPLOADS_PATH
      - name: JWT_SECRET
        valueFrom:
          configMapKeyRef:
            name: nutritrace-cm
            key: JWT_SECRET
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values:
            - worker-4
  volumes:
  - name: nutritrace-vol
    nfs:
      server: 192.168.1.65
      path: /mnt/pve/bigkev/nutritrace
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
