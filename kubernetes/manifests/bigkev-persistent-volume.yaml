apiVersion: v1
kind: PersistentVolume
metadata:
  name: bigkev-pv
spec:
  capacity:
    storage: 1Ti 
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany  
  persistentVolumeReclaimPolicy: Retain
  storageClassName: bigkev-storage # <--- Added this to match the PVC
  nfs:
    path: /mnt/pve/bigkev
    server: 192.168.1.212
