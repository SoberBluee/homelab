spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadWriteMany"]
  storageClassName: bigkev-storage
  nfs:
    server: 192.168.1.65
    path: /mnt/pve/bigkev/nextcloud-namespace-nextcloud-vct-nextcloud-postgres-0-pvc-b007b4bc-fd6c-4011-84cb-07c49319b17a