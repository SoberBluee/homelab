apiVersion: v1
kind: PersistentVolume
metadata:
  name: uptime-kuma-data-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: bigkev-storage
  nfs:
    server: 192.168.1.65
    path: /mnt/pve/bigkev/uptime-kuma
