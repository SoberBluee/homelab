apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma-headless-service
  namespace: uptime-kuma-namespace
spec:
  clusterIP: None
  selector:
    app: uptime-kuma-app
  ports:
    - name: uptime-kuma
      port: 3001

---

apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma-service
  namespace: uptime-kuma-namespace
spec:
  type: ClusterIP
  selector:
    app: uptime-kuma-app
  ports:
    - name: uptime-kuma
      port: 3001
      targetPort: 3001
